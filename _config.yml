title: "AquilaCyber: Start in Cybersecurity"
description: "A free, ordered path from no experience to your first security role."
theme: jekyll-theme-minimal

plugins:
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-default-layout

readme_index:
  enabled: true
relative_links:
  enabled: true
  collections: false
optional_front_matter:
  enabled: true
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: true
  collections: false

# The optional front matter plugin skips files named CONTRIBUTING unless they are listed here.
include:
  - CONTRIBUTING.md

exclude:
  - scripts
  - .github
