name: External links

# Runs weekly and on demand. It is not part of the pull request checks because
# external sites go down for reasons that have nothing to do with a change.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  external:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in original content
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --timeout 30
            --max-retries 2
            --max-concurrency 4
            --accept 200,201,202,203,204,206,403,429
            --exclude-path reference
            --exclude-path .github
            './**/*.md'
          fail: true
